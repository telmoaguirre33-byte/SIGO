name: SIGO Official Domain Auth

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sigo-official-domain-auth.yml'
      - 'scripts/apply-production-trust.mjs'

jobs:
  sync-auth-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SIGO_PRODUCTION_URL: https://www.sigo-gestion.com/
      SIGO_LEGACY_URL: https://comercial-lilac.vercel.app/
    steps:
      - name: Validate credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error::Faltan SUPABASE_ACCESS_TOKEN o SUPABASE_PROJECT_REF"
            exit 1
          fi

      - name: Sync Supabase Auth URLs
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/auth"
          current="$(curl -fsS "$endpoint" -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}")"
          current_allow="$(printf '%s' "$current" | jq -r '.uri_allow_list // ""')"

          add_url() {
            local candidate="$1"
            case ",${current_allow}," in
              *",${candidate},"*) ;;
              *) current_allow="${current_allow:+${current_allow},}${candidate}" ;;
            esac
          }

          add_url "${SIGO_PRODUCTION_URL}"
          add_url "${SIGO_PRODUCTION_URL}**"
          add_url "${SIGO_LEGACY_URL}"
          add_url "${SIGO_LEGACY_URL}**"

          payload="$(jq -n \
            --arg site "$SIGO_PRODUCTION_URL" \
            --arg allow "$current_allow" \
            '{site_url: $site, uri_allow_list: $allow}')"

          curl -fsS -X PATCH "$endpoint" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload" >/dev/null

          verified="$(curl -fsS "$endpoint" -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}")"
          site="$(printf '%s' "$verified" | jq -r '.site_url // ""')"
          allow="$(printf '%s' "$verified" | jq -r '.uri_allow_list // ""')"

          test "$site" = "$SIGO_PRODUCTION_URL"
          printf '%s' "$allow" | grep -Fq "$SIGO_PRODUCTION_URL"
          echo "SIGO Auth domain synchronized: $site"
