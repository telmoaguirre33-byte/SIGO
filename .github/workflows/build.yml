name: Build SIGO

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: sigo_archivo_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build SIGO
        run: npm run build

      - name: Verify commercial archive with synthetic PostgreSQL and UI
        run: npm run test:archivo-productos

      - name: Verify archive and sale concurrency in isolated PostgreSQL 17
        env:
          SIGO_ARCHIVO_TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/sigo_archivo_test
        run: node --test tests/archivoProductos.concurrent.test.mjs

      - name: Verify manual measured sales and pending payment recovery
        run: npm run test:manual-medidas

      - name: Verify manual sales in Chromium without real services
        run: |
          npx playwright install --with-deps chromium
          node scripts/test-venta-medidas-browser.mjs

      - name: Verify read-only production migration gate (synthetic fixtures)
        run: node --test scripts/test-production-migration-gate.mjs

      - name: Verify initial-unit correction UI and purchase contract
        run: npm run test:unit-correction

      - name: Verify administrator notification security
        run: npm run test:admin-notifications

      - name: Verify critical SIGO flow
        run: npm run verify:critical

