name: Build SIGO

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build SIGO
        run: npm run build

      - name: Verify administrator notification security
        run: npm run test:admin-notifications

      - name: Verify critical SIGO flow
        run: npm run verify:critical
