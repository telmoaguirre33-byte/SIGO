name: Build SIGO

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build SIGO
        run: npm run build

      - name: Verify manual measured sales and fiscal keyboard flows
        run: |
          npm run test:manual-medidas
          npm run test:fiscal-caja

      - name: Verify fiscal print output without printers or fiscal requests
        run: |
          npx playwright install --with-deps chromium
          python -m pip install PyMuPDF==1.26.6
          node scripts/test-venta-medidas-browser.mjs
          node scripts/test-arca-fiscal-print.mjs

      - name: Verify administrator notification security
        run: npm run test:admin-notifications

      - name: Verify read-only production migration gate (synthetic fixtures)
        run: node --test scripts/test-production-migration-gate.mjs

      - name: Verify critical SIGO flow
        run: npm run verify:critical
