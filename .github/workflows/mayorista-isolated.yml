name: Mayorista aislado · TypeScript e IndexedDB
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/modules/mayorista/**'
      - 'src/ModulosControlPanel.tsx'
      - '.github/workflows/mayorista-isolated.yml'
permissions:
  contents: read
concurrency:
  group: mayorista-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mayorista_ci_only
          POSTGRES_DB: mayorista_qa
        ports:
          - '127.0.0.1:55471:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d mayorista_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: src/modules/mayorista/demo
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Instalar herramientas aisladas, sin scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Registrar lockfile público de herramientas
        run: node -e "console.log('MAYORISTA_LOCKFILE_JSON='+JSON.stringify(JSON.parse(require('fs').readFileSync('package-lock.json','utf8'))))"
      - name: Chequear TypeScript Mayorista
        run: npm run typecheck
      - name: Generar demo aislada
        run: npm run build
      - name: Pruebas unitarias y controles de regresión
        run: |
          npm run test:unit
          npm run test:security
          npm run test:admin
          npm run test:recovery
          npm run test:integration-pwa
          npm run test:http-auth
          npm run test:rendiciones
      - name: Políticas RLS en PostgreSQL efímero local
        run: npm run test:rls
      - name: IndexedDB en Chromium real
        run: npm test
      - name: Guardar evidencia y lockfile generado
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mayorista-evidencia-${{ github.run_id }}
          path: |
            src/modules/mayorista/tests/artifacts/
            src/modules/mayorista/demo/package-lock.json
          if-no-files-found: warn
          retention-days: 7
