name: Minorista scanner regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/BarcodeScanner.tsx'
      - 'src/SigoApp.tsx'
      - 'src/VentaRapidaOperativa.tsx'
      - 'src/barcode.ts'
      - 'src/comprobanteCaja.ts'
      - 'src/comprobantePdf.ts'
      - 'src/ComprobanteCajaPanel.tsx'
      - 'api/arca/comprobante.js'
      - 'api/arca/cae-v2.js'
      - 'scripts/test-caja-comprobantes.mjs'
      - 'scripts/test-caja-fiscal-read.mjs'
      - 'scripts/test-minorista-scanner.mjs'
      - 'tests/minorista/**'
      - '.github/workflows/minorista-scanner.yml'
permissions:
  contents: read
jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Build original application
        run: npm run build
      - name: Test original scanner handlers
        run: node scripts/test-minorista-scanner.mjs
      - name: Verify existing scanner and sale guards
        run: node scripts/verify-scanner-queue-and-sale-readback.mjs
      - name: Test receipt integrity, PDF and authorized read-only fiscal recovery
        run: |
          node scripts/test-caja-comprobantes.mjs
          node --experimental-vm-modules scripts/test-caja-fiscal-read.mjs
      - name: Install isolated browser test runner
        run: npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Install PDF inspection tools
        run: sudo apt-get install -y poppler-utils
      - name: Test Products, Stock and Caja in Chromium with isolated data
        run: npx playwright test --config tests/minorista/playwright.config.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: minorista-scanner-evidence
          path: test-results/
