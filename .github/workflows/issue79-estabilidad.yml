name: Minorista issue 79 - estabilidad y permisos
on:
  pull_request:
    branches: [main]
    paths: ['src/**','api/informes/**','api/inventario/**','scripts/test-issue79-estabilidad.mjs','scripts/verify-guardar-compra-ia.mjs','.github/workflows/issue79-estabilidad.yml']
permissions:
  contents: read
jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node scripts/verify-guardar-compra-ia.mjs
      - run: node scripts/test-issue79-estabilidad.mjs
