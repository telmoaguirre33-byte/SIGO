name: Compra IA review regression

on:
  push:
    branches: [feat/ia-review-center]
  pull_request:
    branches: [main]
    paths:
      - 'src/ComprasOperativas.tsx'
      - 'src/facturaIA.ts'
      - 'src/compraIARevision.*'
      - 'api/compras/analizar-factura.js'
      - 'scripts/verify-compra-ia-review.mjs'
      - '.github/workflows/compra-ia-review-regression.yml'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Compile SIGO
        run: npm run build
      - name: Verify unnumbered documents, text and editable prices
        run: node scripts/verify-compra-ia-review.mjs
      - name: Existing critical safety suite
        run: npm run verify:critical
