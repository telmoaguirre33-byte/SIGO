name: SIGO 122 - respaldo privado en nube (sin publicar)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'prepare: conexión/destino. capture: respaldo/restore, nunca SQL productivo.'
        type: choice
        options: [prepare, exercise, capture, schema-probe]
        default: prepare
        required: true

permissions:
  contents: read

concurrency:
  group: sigo-122-private-backup
  cancel-in-progress: false

jobs:
  isolated-backup:
    if: github.repository == 'telmoaguirre33-byte/SIGO' && github.ref == 'refs/heads/ops/122-respaldo-local'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Guardas unitarias de la herramienta existente
        working-directory: docs/operacion-controlada/respaldo-local
        run: python3 -m unittest test_respaldo.py test_cloud.py
      - name: Ensayo con imagen Supabase sin credenciales productivas
        if: inputs.action == 'exercise'
        working-directory: docs/operacion-controlada/respaldo-local
        run: python3 cloud.py exercise
      - name: Operador privado sin artifacts
        if: inputs.action != 'exercise'
        working-directory: docs/operacion-controlada/respaldo-local
        env:
          SIGO_BACKUP_DATABASE_URL: ${{ secrets.SIGO_BACKUP_DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SIGO_BACKUP_STORAGE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BACKUP_ACTION: ${{ inputs.action }}
        run: python3 cloud.py "$BACKUP_ACTION"
