name: SIGO Production Operational Smoke

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'api/arca/**'
      - 'api/compras/**'
      - 'src/Arca*.tsx'
      - 'src/BarcodeScanner.tsx'
      - 'src/VentaRapidaOperativa.tsx'
      - 'src/ComprasOperativas.tsx'
      - 'src/productos.ts'
      - 'src/barcode.ts'
      - 'src/ventas.ts'
      - 'src/compras.ts'
      - 'src/facturaIA.ts'
      - 'scripts/production-operational-smoke.sql'
      - 'scripts/production-arca-readiness.sql'
      - 'scripts/verify-critical.mjs'
      - 'scripts/verify-arca-*.mjs'
      - '.github/workflows/production-operational-smoke.yml'
      - '.github/workflows/qa-transaction-probe.yml'
  workflow_dispatch:

concurrency:
  group: sigo-production-operational-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolve production read-only smoke connection
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "::error title=Missing production secret::SUPABASE_PROJECT_REF is required."
            exit 1
          fi

          test_url() {
            local candidate="$1"
            echo "::add-mask::$candidate"
            if timeout 10s supabase migration list --db-url "$candidate" >/tmp/sigo-smoke-migrations.txt 2>/tmp/sigo-smoke-db-error.txt; then
              cat /tmp/sigo-smoke-migrations.txt
              echo "SIGO_SMOKE_DB_URL=$candidate" >> "$GITHUB_ENV"
              return 0
            fi
            return 1
          }

          if [ -n "${SUPABASE_DB_URL:-}" ] && test_url "$SUPABASE_DB_URL"; then
            echo "Production smoke connection resolved from SUPABASE_DB_URL."
            exit 0
          fi
          if [ -n "${SUPABASE_POOLER_URL:-}" ] && test_url "$SUPABASE_POOLER_URL"; then
            echo "Production smoke connection resolved from SUPABASE_POOLER_URL."
            exit 0
          fi
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error title=Missing production database credential::Configure SUPABASE_DB_URL/SUPABASE_POOLER_URL or SUPABASE_DB_PASSWORD."
            exit 1
          fi

          encoded_password="$(python3 - <<'PY'
          import os
          from urllib.parse import quote
          print(quote(os.environ['SUPABASE_DB_PASSWORD'], safe=''))
          PY
          )"
          echo "::add-mask::$encoded_password"

          direct="postgresql://postgres:${encoded_password}@db.${SUPABASE_PROJECT_REF}.supabase.co:5432/postgres?sslmode=require"
          if test_url "$direct"; then
            echo "Production smoke connection resolved through direct database endpoint."
            exit 0
          fi

          regions=(
            sa-east-1 us-east-1 us-east-2 us-west-1 us-west-2 ca-central-1
            eu-west-1 eu-west-2 eu-west-3 eu-central-1 eu-central-2 eu-north-1
            ap-southeast-1 ap-southeast-2 ap-northeast-1 ap-northeast-2 ap-south-1
          )
          for region in "${regions[@]}"; do
            for generation in aws-0 aws-1; do
              host="${generation}-${region}.pooler.supabase.com"
              candidate="postgresql://postgres.${SUPABASE_PROJECT_REF}:${encoded_password}@${host}:5432/postgres?sslmode=require"
              if test_url "$candidate"; then
                echo "Production smoke connection resolved through Supabase session pooler ${generation}/${region}."
                exit 0
              fi
            done
          done

          cat /tmp/sigo-smoke-db-error.txt >&2 || true
          echo "::error title=Production smoke blocked::No safe Postgres connection could reach the SIGO production database."
          exit 1

      - name: Ensure psql client
        shell: bash
        run: |
          set -euo pipefail
          if command -v psql >/dev/null 2>&1; then
            psql --version
            exit 0
          fi
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client
          psql --version

      - name: Wait until production migrations are current
        shell: bash
        run: |
          set -euo pipefail

          migration_issues() {
            local state="$1"
            SIGO_MIGRATION_STATE="$state" python3 - <<'PY'
          import os
          import re

          issues = []
          state = os.environ.get("SIGO_MIGRATION_STATE", "")
          for raw in state.splitlines():
              parts = raw.split("|")
              if len(parts) < 2:
                  continue
              local = re.sub(r"\D", "", parts[0])
              remote = re.sub(r"\D", "", parts[1])
              if len(local) == 14 and not remote:
                  issues.append(f"pending:{local}")
              elif len(remote) == 14 and not local:
                  issues.append(f"remote-only:{remote}")
              elif len(local) == 14 and len(remote) == 14 and local != remote:
                  issues.append(f"mismatch:{local}:{remote}")
          print("\n".join(issues))
          PY
          }

          last_state=""
          for attempt in $(seq 1 24); do
            state="$(supabase migration list --db-url "$SIGO_SMOKE_DB_URL")"
            last_state="$state"
            issues="$(migration_issues "$state")"
            if [ -z "$issues" ]; then
              echo "$state"
              echo "Production migration state is current."
              exit 0
            fi

            echo "Production migrations are not current yet (attempt ${attempt}/24):"
            echo "$issues"
            if printf '%s\n' "$issues" | grep -qE '^(remote-only|mismatch):'; then
              echo "$state"
              echo "::error title=Production migration history mismatch::Operational smoke refuses to certify divergent migration history."
              exit 1
            fi
            sleep 5
          done

          echo "$last_state"
          echo "::error title=Production migrations pending::Operational smoke waited for deployment but production still has unapplied migrations."
          exit 1

      - name: Run production operational smoke
        shell: bash
        run: |
          set -euo pipefail
          echo "Running read-only SIGO production checks: initial stock, product invariants, scanner identities and monetary transaction integrity."
          psql "$SIGO_SMOKE_DB_URL" -X -v ON_ERROR_STOP=1 -f scripts/production-operational-smoke.sql | tee /tmp/sigo-production-smoke.log
          grep -q 'SIGO_SMOKE_TEST_PRODUCT' /tmp/sigo-production-smoke.log
          echo "SIGO_PRODUCTION_OPERATIONAL_SMOKE_COMPLETED"

      - name: Read ARCA production readiness
        shell: bash
        run: |
          set -euo pipefail
          echo "Reading ARCA readiness without authenticating WSAA or issuing a fiscal document."
          psql "$SIGO_SMOKE_DB_URL" -X -v ON_ERROR_STOP=1 -f scripts/production-arca-readiness.sql 2>&1 | tee /tmp/sigo-arca-readiness.log
          grep -q 'SIGO_ARCA_PRODUCTION_STATUS' /tmp/sigo-arca-readiness.log
          grep -q 'SIGO_ARCA_READINESS_COMPLETED' /tmp/sigo-arca-readiness.log
