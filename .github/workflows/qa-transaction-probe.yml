name: SIGO QA Transaction Probe

on:
  push:
    branches:
      - qa/transaction-probe-20260913-run

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolve production database
        shell: bash
        run: |
          set -euo pipefail
          test_url() {
            local candidate="$1"
            echo "::add-mask::$candidate"
            if timeout 10s supabase migration list --db-url "$candidate" >/dev/null 2>/tmp/sigo-qa-db-error.txt; then
              echo "SIGO_QA_DB_URL=$candidate" >> "$GITHUB_ENV"
              return 0
            fi
            return 1
          }
          if [ -n "${SUPABASE_DB_URL:-}" ] && test_url "$SUPABASE_DB_URL"; then exit 0; fi
          if [ -n "${SUPABASE_POOLER_URL:-}" ] && test_url "$SUPABASE_POOLER_URL"; then exit 0; fi
          if [ -z "${SUPABASE_PROJECT_REF:-}" ] || [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "Missing production database secrets" >&2
            exit 1
          fi
          encoded_password="$(python3 - <<'PY'
          import os
          from urllib.parse import quote
          print(quote(os.environ['SUPABASE_DB_PASSWORD'], safe=''))
          PY
          )"
          echo "::add-mask::$encoded_password"
          direct="postgresql://postgres:${encoded_password}@db.${SUPABASE_PROJECT_REF}.supabase.co:5432/postgres?sslmode=require"
          if test_url "$direct"; then exit 0; fi
          regions=(sa-east-1 us-east-1 us-east-2 us-west-1 us-west-2 ca-central-1 eu-west-1 eu-west-2 eu-west-3 eu-central-1 eu-central-2 eu-north-1 ap-southeast-1 ap-southeast-2 ap-northeast-1 ap-northeast-2 ap-south-1)
          for region in "${regions[@]}"; do
            for generation in aws-0 aws-1; do
              candidate="postgresql://postgres.${SUPABASE_PROJECT_REF}:${encoded_password}@${generation}-${region}.pooler.supabase.com:5432/postgres?sslmode=require"
              if test_url "$candidate"; then exit 0; fi
            done
          done
          cat /tmp/sigo-qa-db-error.txt >&2 || true
          exit 1

      - name: Run transactional purchase-sale-cash probe and rollback
        shell: bash
        run: |
          set -euo pipefail
          psql "$SIGO_QA_DB_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          do $$
          declare
            v_empresa uuid;
            v_user uuid;
            v_product uuid;
            v_supplier uuid;
            v_stock_before numeric;
            v_stock_after_purchase numeric;
            v_stock_after_purchase_retry numeric;
            v_stock_after_sale numeric;
            v_stock_after_sale_retry numeric;
            v_cost numeric;
            v_price numeric;
            v_purchase uuid;
            v_purchase_retry uuid;
            v_sale uuid;
            v_sale_retry uuid;
            v_purchase_items integer;
            v_sale_items integer;
            v_cash_rows integer;
            v_cash_total numeric;
            v_sale_total numeric;
            v_purchase_total numeric;
            v_tx text := txid_current()::text;
          begin
            select e.id into v_empresa
            from public.empresas e
            where lower(btrim(e.nombre)) = lower('SIGO Administración') and e.activa = true
            limit 1;
            if v_empresa is null then raise exception 'QA_TENANT_NOT_FOUND'; end if;

            select eu.user_id into v_user
            from public.empresa_usuarios eu
            where eu.empresa_id = v_empresa and eu.activo = true and eu.rol = 'owner'
            order by eu.created_at asc nulls last
            limit 1;
            if v_user is null then raise exception 'QA_OWNER_NOT_FOUND'; end if;

            perform set_config('request.jwt.claim.sub', v_user::text, true);
            perform set_config('request.jwt.claims', jsonb_build_object('sub', v_user::text, 'role', 'authenticated')::text, true);

            if not public.tiene_permiso_empresa(v_empresa, 'purchases.write') then raise exception 'QA_OWNER_PURCHASE_PERMISSION_FAILED'; end if;
            if not public.tiene_permiso_empresa(v_empresa, 'stock.write') then raise exception 'QA_OWNER_STOCK_PERMISSION_FAILED'; end if;
            if not public.tiene_permiso_empresa(v_empresa, 'sales.write') then raise exception 'QA_OWNER_SALE_PERMISSION_FAILED'; end if;

            select p.id, p.stock_actual, p.costo_actual, p.precio_venta
              into v_product, v_stock_before, v_cost, v_price
            from public.productos p
            where p.empresa_id = v_empresa
              and p.activo = true
              and upper(btrim(coalesce(p.categoria,''))) <> 'NO_VENDIBLE'
              and coalesce(p.stock_actual,0) > 0
              and coalesce(p.precio_venta,0) > 0
              and coalesce(p.costo_actual,0) >= 0
            order by p.id
            limit 1;
            if v_product is null then raise exception 'QA_PRODUCT_NOT_FOUND'; end if;

            select s.id into v_supplier
            from public.proveedores_sigo s
            where s.empresa_id = v_empresa and s.activo = true
            order by s.created_at asc
            limit 1;
            if v_supplier is null then
              insert into public.proveedores_sigo(empresa_id, razon_social, nombre_fantasia, activo)
              values (v_empresa, 'QA Proveedor Transaccional', 'QA Proveedor', true)
              returning id into v_supplier;
            end if;

            v_purchase := public.confirmar_compra_sigo(
              v_empresa,
              v_supplier,
              jsonb_build_array(jsonb_build_object('producto_id',v_product::text,'cantidad',2,'costo_unitario',v_cost)),
              current_date,
              'QA',
              'QA-' || v_tx,
              'qa-purchase-' || v_tx
            );

            select stock_actual into v_stock_after_purchase from public.productos where id = v_product and empresa_id = v_empresa;
            if v_stock_after_purchase <> v_stock_before + 2 then
              raise exception 'QA_PURCHASE_STOCK_FAILED before=% after=%', v_stock_before, v_stock_after_purchase;
            end if;

            v_purchase_retry := public.confirmar_compra_sigo(
              v_empresa,
              v_supplier,
              jsonb_build_array(jsonb_build_object('producto_id',v_product::text,'cantidad',2,'costo_unitario',v_cost)),
              current_date,
              'QA',
              'QA-' || v_tx,
              'qa-purchase-' || v_tx
            );
            select stock_actual into v_stock_after_purchase_retry from public.productos where id = v_product and empresa_id = v_empresa;
            if v_purchase_retry <> v_purchase or v_stock_after_purchase_retry <> v_stock_after_purchase then
              raise exception 'QA_PURCHASE_IDEMPOTENCY_FAILED';
            end if;

            select count(*), coalesce(sum(subtotal),0) into v_purchase_items, v_purchase_total
            from public.compra_items_sigo where compra_id = v_purchase and empresa_id = v_empresa;
            if v_purchase_items <> 1 or round(v_purchase_total,2) <> round(v_cost * 2,2) then
              raise exception 'QA_PURCHASE_DETAIL_FAILED rows=% total=%', v_purchase_items, v_purchase_total;
            end if;

            v_sale := public.confirmar_venta_sigo_v2(
              v_empresa,
              jsonb_build_array(jsonb_build_object('producto_id',v_product::text,'cantidad',1)),
              'efectivo',
              'qa-sale-' || v_tx,
              null
            );

            select stock_actual into v_stock_after_sale from public.productos where id = v_product and empresa_id = v_empresa;
            if v_stock_after_sale <> v_stock_before + 1 then
              raise exception 'QA_SALE_STOCK_FAILED before=% after=%', v_stock_before, v_stock_after_sale;
            end if;

            v_sale_retry := public.confirmar_venta_sigo_v2(
              v_empresa,
              jsonb_build_array(jsonb_build_object('producto_id',v_product::text,'cantidad',1)),
              'efectivo',
              'qa-sale-' || v_tx,
              null
            );
            select stock_actual into v_stock_after_sale_retry from public.productos where id = v_product and empresa_id = v_empresa;
            if v_sale_retry <> v_sale or v_stock_after_sale_retry <> v_stock_after_sale then
              raise exception 'QA_SALE_IDEMPOTENCY_FAILED';
            end if;

            select count(*), coalesce(sum(subtotal),0) into v_sale_items, v_sale_total
            from public.venta_items_sigo where venta_id = v_sale and empresa_id = v_empresa;
            if v_sale_items <> 1 or round(v_sale_total,2) <> round(v_price,2) then
              raise exception 'QA_SALE_DETAIL_FAILED rows=% total=%', v_sale_items, v_sale_total;
            end if;

            select count(*), coalesce(sum(importe),0) into v_cash_rows, v_cash_total
            from public.caja_movimientos_sigo
            where empresa_id = v_empresa and venta_id = v_sale and tipo = 'ingreso' and medio_pago = 'efectivo';
            if v_cash_rows <> 1 or round(v_cash_total,2) <> round(v_price,2) then
              raise exception 'QA_CASH_FAILED rows=% total=% expected=%', v_cash_rows, v_cash_total, v_price;
            end if;

            raise notice 'SIGO_QA_TRANSACTION_PROBE_OK product=% stock_before=% after_purchase=% after_sale=% purchase=% sale=% cash=%',
              v_product, v_stock_before, v_stock_after_purchase, v_stock_after_sale, v_purchase, v_sale, v_cash_total;
          end
          $$;
          rollback;
          select 'SIGO_QA_TRANSACTION_PROBE_ROLLED_BACK' as marker;
          SQL
